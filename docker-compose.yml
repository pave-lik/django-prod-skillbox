services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    restart: always

    ports:
      - "8001:8000"

    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,0.0.0.0"

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn mysite.wsgi:application
      --bind 0.0.0.0:8000
      "
